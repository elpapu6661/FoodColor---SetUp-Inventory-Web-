<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso restringido | ColorFood</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #101014; color: #f5f5f5;
}
.card {
  width: 100%; max-width: 380px; padding: 40px 34px;
  background: #1a1a1f; border: 1px solid #2a2a32; border-radius: 16px;
}
.logo { font-size: 1.6rem; font-weight: 700; text-align: center; }
.logo em { color: #ff3d5a; font-style: normal; }
.sub { font-size: .78rem; color: #888; text-align: center; margin: 6px 0 28px; }
label { display: block; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: #888; margin-bottom: 6px; }
input {
  width: 100%; padding: 11px 13px; margin-bottom: 16px;
  background: #101014; border: 1px solid #2a2a32; border-radius: 8px;
  color: #f5f5f5; font-size: .9rem; outline: none;
}
input:focus { border-color: #ff3d5a; }
button {
  width: 100%; padding: 12px; margin-top: 6px;
  background: #ff3d5a; color: #fff; border: none; border-radius: 8px;
  font-size: .95rem; font-weight: 600; cursor: pointer;
}
button:hover { background: #e62e4a; }
.error {
  background: rgba(255,61,90,.1); border: 1px solid rgba(255,61,90,.4);
  color: #ff3d5a; font-size: .82rem; padding: 10px 12px;
  border-radius: 8px; margin-bottom: 16px; text-align: center;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Color<em>Food</em></div>
  <div class="sub">Sistema de Inventario · Solo personal autorizado</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>Usuario</label>
    <input type="text" name="usuario" required autofocus>
    <label>Contraseña</label>
    <input type="password" name="password" required>
    <button type="submit">Iniciar sesión</button>
  </form>
</div>
</body>
</html>
