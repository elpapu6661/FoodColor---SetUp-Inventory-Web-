server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

spring.application.name=foodcolor-inventory
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Jackson configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Santiago
spring.jackson.locale=es_CL

# File storage paths
app.data.dir=${user.dir}/data
app.products.file=${app.data.dir}/products.json
app.orders.file=${app.data.dir}/pedidos.json

# Security
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:foodcolor2026}
app.security.bcrypt-strength=12
app.security.session-timeout=1800
app.security.remember-me-key=${REMEMBER_ME_KEY:foodcolor-remember-me-key}

# Rate limiting (requests per minute)
app.rate-limit.api=60
app.rate-limit.login=5
app.rate-limit.contact=10

# Logging
logging.level.com.foodcolor=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator (health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized